<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>РАО — Расчёт</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1a2d;
      --text:#e8eefc;
      --muted:#a8b4d6;
      --line:rgba(255,255,255,.10);
      --accent:#4f8cff;
      --accent2:#2dd4bf;
      --danger:#ff5a6b;
      --shadow: 0 18px 45px rgba(0,0,0,.35);
      --radius: 16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 700px at 10% 0%, rgba(79,140,255,.18), transparent 55%),
        radial-gradient(1000px 600px at 90% 20%, rgba(45,212,191,.14), transparent 55%),
        var(--bg);
      color:var(--text);
    }
    .wrap{ max-width: 1060px; margin: 28px auto; padding: 0 16px; }
    .topbar{ display:flex; gap:16px; align-items:flex-start; justify-content:space-between; margin-bottom: 16px; }
    .brand{ display:flex; flex-direction:column; gap:6px; }
    .brand h1{ font-size: 20px; margin:0; letter-spacing:.2px; }
    .brand p{ margin:0; color:var(--muted); font-size: 14px; line-height: 1.35; }
    .grid{ display:grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
    @media (max-width: 920px){ .grid{ grid-template-columns:1fr; } }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .head{ padding: 16px 16px 12px 16px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.15); }
    .card .body{ padding: 16px; }

    .progressRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top: 10px; }
    .progress{ flex:1; height: 10px; background: rgba(255,255,255,.08); border-radius: 999px; overflow:hidden; border: 1px solid rgba(255,255,255,.06); }
    .progress > div{ height:100%; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .25s ease; }
    .progressLabel{ font-size: 12px; color:var(--muted); white-space:nowrap; }

    .questionTitle{ font-size: 16px; margin: 0 0 8px 0; }
    .questionText{ margin: 0 0 14px 0; color: var(--muted); font-size: 14px; line-height: 1.45; }

    label{ display:block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    input, select{
      width:100%;
      padding: 12px 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      color: var(--text);
      outline:none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder{ color: rgba(168,180,214,.65); }
    input:focus, select:focus{ border-color: rgba(79,140,255,.55); box-shadow: 0 0 0 4px rgba(79,140,255,.12); }

    .error{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,90,107,.35);
      background: rgba(255,90,107,.10);
      color: #ffd2d8;
      font-size: 13px;
      display:none;
    }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px; }
    .btn{
      appearance:none; border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 600;
      font-size: 14px;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.09); }
    .btn:active{ transform: translateY(1px); }
    .btn[disabled]{ opacity:.5; cursor:not-allowed; }
    .btnPrimary{ background: linear-gradient(90deg, rgba(79,140,255,.95), rgba(45,212,191,.70)); border-color: rgba(255,255,255,.10); color: #08101f; }
    .btnGhost{ background: transparent; }
    .btnDanger{ border-color: rgba(255,90,107,.28); background: rgba(255,90,107,.10); color:#ffd2d8; }

    .pill{
      display:inline-flex; align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-size: 12px;
      gap: 8px;
    }

    .kv{ display:grid; grid-template-columns: 1fr; gap:10px; }
    .kv .item{ padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.18); }
    .kv .k{ font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .kv .v{ font-size: 14px; color: var(--text); word-break: break-word; }

    pre{
      margin:0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.25);
      white-space: pre-wrap;
      min-height: 140px;
      color: #dfe8ff;
      font-size: 13px;
      line-height: 1.35;
    }
    .row2{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 10px; }
    .spinner{
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: rgba(255,255,255,.85);
      border-radius: 999px;
      animation: spin .8s linear infinite;
      display:none;
    }
    .loadingBox{
      display:none;
      align-items:center;
      gap:10px;
      margin-top:10px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.18);
      flex-wrap:wrap;
    }
    .loadingText{ font-size:13px; color: var(--text); }
    .loadingPercent{ font-size:12px; color: var(--muted); margin-left:auto; }
    .loadingBar{
      width:100%;
      height:6px;
      background: rgba(255,255,255,.12);
      border-radius:999px;
      overflow:hidden;
    }
    .loadingFill{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, #4cc9f0, #54e6d7);
      transition: width .3s ease;
    }
    @keyframes spin{ to{ transform: rotate(360deg);} }
    .muted{ color: var(--muted); font-size: 13px; }
    
    #inputBox label { display: none; }

    .licenseList{ display:flex; flex-direction:column; gap:10px; }
    .licenseItem{ padding:12px; border-radius:12px; border:1px solid var(--line); background: rgba(0,0,0,.18); }
    .licenseHeader{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .licenseInfo{ flex:1; }
    .licenseCheck{
      margin-top:2px;
      width:18px;
      height:18px;
      accent-color: #4cc9f0;
      flex: 0 0 auto;
    }
    .licenseSelectAll{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .licenseMeta{ font-size:12px; color: var(--muted); margin-top:4px; }
    .licenseControls{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .licenseSelect{ width:100%; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1>РАО </h1>
        <p>Расчёт ставок теле- и радиовещателей</b></p>
      </div>
      <div class="pill">Интерфейс: /api/calc</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="head">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
            <div class="pill" id="stepPill">Шаг 1</div>
            <div class="progressLabel" id="progressLabel">0%</div>
          </div>
          <div class="progressRow">
            <div class="progress"><div id="progressBar"></div></div>
          </div>
        </div>

        <div class="body">
          <h2 class="questionTitle" id="qTitle">Вопрос</h2>
          <p class="questionText" id="qText"></p>

          <div id="inputBox"></div>
          <div class="error" id="errBox"></div>
          <div class="muted" id="hintBox" style="margin-top:10px; display:none;"></div>
          <div class="loadingBox" id="loadingBox">
            <div class="spinner" id="loadingSpin" style="display:inline-block;"></div>
            <div class="loadingText" id="loadingText">Выполняется обработка…</div>
            <div class="loadingPercent" id="loadingPercent">0%</div>
            <div class="loadingBar">
              <div class="loadingFill" id="loadingFill"></div>
            </div>
          </div>


          <div class="actions">
            <button class="btn btnGhost" id="backBtn">← Назад</button>
            <button class="btn btnPrimary" id="nextBtn">Далее →</button>
            <button class="btn btnDanger" id="restartBtn">Начать заново</button>
          </div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="card">
          <div class="head">
            <div class="row2">
              <div class="pill">Введённые данные</div>
              <div class="muted">Пожалуйста, заполняйте шаги слева.</div>
            </div>
          </div>
          <div class="body">
            <div class="kv" id="summary"></div>
          </div>
        </div>

        <div class="card">
          <div class="head">
            <div class="row2">
              <div class="pill">Результат</div>
              <div style="display:flex; align-items:center; gap:10px;">
                <div class="spinner" id="spin"></div>
                <button class="btn" id="copyBtn">Скопировать</button>
              </div>
            </div>
          </div>
          <div class="body">
            <pre id="output">Результат появится здесь после завершения расчёта.</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

 <script>
  const A = {};

  const qTitle = document.getElementById("qTitle");
  const footerHelp = document.getElementById("footerHelp");
  const qText  = document.getElementById("qText");
  const inputBox = document.getElementById("inputBox");
  const errBox = document.getElementById("errBox");
  const hintBox = document.getElementById("hintBox");

  const backBtn = document.getElementById("backBtn");
  const nextBtn = document.getElementById("nextBtn");
  const restartBtn = document.getElementById("restartBtn");
  const copyBtn = document.getElementById("copyBtn");

  const stepPill = document.getElementById("stepPill");
  const progressLabel = document.getElementById("progressLabel");
  const progressBar = document.getElementById("progressBar");

  const summary = document.getElementById("summary");
  const output = document.getElementById("output");
  const spin = document.getElementById("spin");
  const loadingBox = document.getElementById("loadingBox");
  const loadingText = document.getElementById("loadingText");
  const loadingPercent = document.getElementById("loadingPercent");
  const loadingSpin = document.getElementById("loadingSpin");
  const loadingFill = document.getElementById("loadingFill");
  const SKIP = "__SKIP__";
  const API_PRIMARY = "https://rnk-wof7.onrender.com";
  const API_FALLBACK = location.origin;
  const API_BASE = location.origin.includes("onrender.com") ? API_FALLBACK : API_PRIMARY;
  const POP_OPTIONS = [
    { label: "менее 19 999 человек", value: 1 },
    { label: "20 000 – 49 999 человек", value: 20000 },
    { label: "50 000 – 149 999 человек", value: 50000 },
    { label: "150 000 – 299 999 человек", value: 150000 },
    { label: "300 000 – 599 999 человек", value: 300000 },
    { label: "600 000 – 999 999 человек", value: 600000 },
    { label: "1 000 000 – 1 999 999 человек", value: 1000000 },
    { label: "2 000 000 – 3 999 999 человек", value: 2000000 },
    { label: "более 4 000 000 человек", value: 4000001 }
  ];

  let loadingTimer = null;
  let loadingValue = 0;
  let loadingCount = 0;

  function updateLoading(){
    if(!loadingBox) return;
    const v = Math.max(0, Math.min(100, loadingValue));
    if(loadingPercent) loadingPercent.textContent = `${Math.round(v)}%`;
    if(loadingFill) loadingFill.style.width = `${Math.round(v)}%`;
  }

  function startLoading(label, forceLabel){
    const first = (loadingCount || 0) === 0;
    loadingCount = (loadingCount || 0) + 1;
    if(label && loadingText && (first || forceLabel)) loadingText.textContent = label;
    if(!first) return;
    loadingValue = 8;
    updateLoading();
    if(loadingBox) loadingBox.style.display = "flex";
    if(loadingSpin) loadingSpin.style.display = "inline-block";
    loadingTimer = setInterval(()=>{
      if(loadingValue < 90){
        loadingValue += 2 + Math.random() * 4;
      }else{
        loadingValue += (95 - loadingValue) * 0.05;
      }
      updateLoading();
    }, 350);
  }

  function stopLoading(){
    loadingCount = Math.max(0, (loadingCount || 0) - 1);
    if(loadingCount > 0) return;
    loadingValue = 100;
    updateLoading();
    if(loadingTimer){
      clearInterval(loadingTimer);
      loadingTimer = null;
    }
    setTimeout(()=>{
      if(loadingBox) loadingBox.style.display = "none";
    }, 300);
  }

  function forceStopLoading(){
    loadingCount = 0;
    loadingValue = 100;
    updateLoading();
    if(loadingTimer){
      clearInterval(loadingTimer);
      loadingTimer = null;
    }
    if(loadingBox) loadingBox.style.display = "none";
  }


  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function isEmptyOrDash(v){
    if(v == null) return true;
    const s = String(v).trim().toLowerCase();
    return s === "" || s === "-" || s === "—" || s === "–" || s === "нет";
  }

  function parseFloatMaybe(v){
    if(isEmptyOrDash(v)) return null;
    const s = String(v).trim().replace(/\s+/g,"").replace(",",".");
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  function parseIntMaybe(v){
    if(isEmptyOrDash(v)) return null;
    const s = String(v).trim().replace(/\s+/g,"");
    const n = Number(s);
    if(!Number.isFinite(n)) return null;
    return Math.trunc(n);
  }

  function parsePositiveInt(v){
    if(isEmptyOrDash(v)) return null;
    const s = String(v).trim().replace(/\s+/g,"");
    if(!s) return null;
    if(!/^\d+$/.test(s)) return null;
    const n = Number(s);
    if(!Number.isFinite(n)) return null;
    return Math.trunc(n);
  }

  function setError(msg){
    errBox.textContent = msg || "";
    errBox.style.display = msg ? "block" : "none";
  }
   
  function setHint(msg){
  hintBox.textContent = msg || "";
  hintBox.style.display = msg ? "block" : "none";
  }

  function setInputText({label, placeholder="", value=""}){
    inputBox.innerHTML = `
      <label>${escapeHtml(label)}</label>
      <input id="userInput" type="text" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(String(value ?? ""))}"/>
    `;
    const el = document.getElementById("userInput");
    el.focus();
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); nextBtn.click(); }
    });
  }

  function setInputSelect({label, choices, value}){
    const opts = choices.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    inputBox.innerHTML = `
      <label>${escapeHtml(label)}</label>
      <select id="userInput">${opts}</select>
    `;
    const el = document.getElementById("userInput");
    if(value != null) el.value = value;
    el.focus();
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); nextBtn.click(); }
    });
  }

  function setInputHtml(html){
    inputBox.innerHTML = html;
  }

  function populationLabelByValue(v){
    const hit = POP_OPTIONS.find(o => Number(o.value) === Number(v));
    return hit ? hit.label : String(v ?? "");
  }

  function populationOptionsHtml(selected){
    const opts = [`<option value="">Выберите значение…</option>`];
    for(const o of POP_OPTIONS){
      const sel = (Number(selected) === Number(o.value)) ? "selected" : "";
      opts.push(`<option value="${o.value}" ${sel}>${escapeHtml(o.label)}</option>`);
    }
    return opts.join("");
  }

  function getSelectedLicenseIdsFromDOM(){
    const boxes = inputBox.querySelectorAll("input[data-lic-id]");
    return Array.from(boxes)
      .filter(b => b.checked)
      .map(b => b.getAttribute("data-lic-id"));
  }

  function getPopulationByLicenseFromDOM(){
    const selects = inputBox.querySelectorAll("select[data-lic-id]");
    const out = {};
    selects.forEach(sel => {
      if(sel.disabled) return;
      const id = sel.getAttribute("data-lic-id");
      const v = sel.value;
      if(id && v){
        const n = Number(v);
        if(Number.isFinite(n)) out[id] = Math.trunc(n);
      }
    });
    return out;
  }

  function getPopulationByLicenseNumericFromDOM(){
    const inputs = inputBox.querySelectorAll("input[data-pop-lic-id]");
    const out = {};
    inputs.forEach(inp => {
      const id = inp.getAttribute("data-pop-lic-id");
      const n = parsePositiveInt(inp.value);
      if(id && n !== null) out[id] = n;
    });
    return out;
  }

  function getUserInput(){
    const el = document.getElementById("userInput");
    if(!el) return "";
    return el.value ?? "";
  }

  async function apiFetch(url, options){
    try{
      const res = await fetch(url, options);
      return res;
    }catch(e){
      return null;
    }
  }

  async function fetchInnInfo(inn, opts){
    const useLoading = !(opts && opts.loading === false);
    if(useLoading) startLoading("Выполняется поиск организации по ИНН…");
    try{
      const res = await apiFetch(`${API_BASE}/api/inninfo?inn=${encodeURIComponent(inn)}`);
      if(!res && API_BASE !== API_FALLBACK){
        const res2 = await apiFetch(`${API_FALLBACK}/api/inninfo?inn=${encodeURIComponent(inn)}`);
        if(res2) return await (async()=>{ return await fetchInnInfoWithRes(inn, res2); })();
      }
      if(!res){
        setHint("Ошибка сети при обращении к /api/inninfo.");
        return false;
      }
      return await fetchInnInfoWithRes(inn, res);
    }catch(e){
      A.org_name = "";
      updateSummary();
      setHint("Ошибка запроса к /api/inninfo.");
      return false;
    }finally{
      if(useLoading) stopLoading();
    }
  }

  async function fetchInnInfoWithRes(inn, res){

    if(!res.ok){
    A.org_name = "";
    updateSummary();
  
    let msg = "Организация по указанному ИНН не найдена.";
    if(res.status !== 404){
      try{
        const data = await res.json();
        msg = "Ошибка при обращении к /api/inninfo: " + (data.error || res.status);
      }catch{
        msg = "Ошибка при обращении к /api/inninfo: " + res.status;
      }
    }
  
    setHint(msg);
    return false;
  }

    const data = await res.json();
    A.org_name = (data && data.ok && data.org_name) ? data.org_name : "";
    updateSummary();
    setHint(A.org_name ? `Организация найдена: ${A.org_name}` : "Организация по указанному ИНН не найдена.");
    return !!A.org_name;
}

  async function fetchLicenses(inn, opts){
    const useLoading = !(opts && opts.loading === false);
    if(useLoading) startLoading("Выполняется поиск лицензий. Это может занять несколько минут.", true);
    try{
      A.licenses_loading = true;
      A.licenses_error = null;
      let res = await apiFetch(`${API_BASE}/api/licenses?inn=${encodeURIComponent(inn)}`);
      if(!res && API_BASE !== API_FALLBACK){
        res = await apiFetch(`${API_FALLBACK}/api/licenses?inn=${encodeURIComponent(inn)}`);
      }
      if(!res){
        A.licenses_all = [];
        A.license_ids = [];
        A.population_by_license = null;
        A.licenses_loading = false;
        A.licenses_error = "Ошибка сети при обращении к /api/licenses.";
        setHint(A.licenses_error);
        return false;
      }
      if(!res.ok){
        A.licenses_all = [];
        A.license_ids = [];
        A.population_by_license = null;
        A.licenses_loading = false;
        let msg = `Ошибка при обращении к /api/licenses: ${res.status}`;
        try{
          const data = await res.json();
          if(data && data.error) msg = data.error;
        }catch{}
        A.licenses_error = msg;
        setHint(A.licenses_error);
        return false;
      }
      const data = await res.json();
      if(!data || !data.ok){
        A.licenses_all = [];
        A.license_ids = [];
        A.population_by_license = null;
        A.licenses_loading = false;
        A.licenses_error = "Лицензии не найдены (ответ сервиса).";
        setHint(A.licenses_error);
        return false;
      }
      A.licenses_all = Array.isArray(data.licenses) ? data.licenses : [];
      A.license_ids = A.licenses_all.map(x => x.license_id);
      A.population_by_license = null;
      A.licenses_loading = false;
      A.licenses_error = null;
      try{
        if(typeof render === "function" && currentStep().key === "license_ids"){
          render();
        }
      }catch{}
      return true;
    }catch(e){
      A.licenses_all = [];
      A.license_ids = [];
      A.population_by_license = null;
      A.licenses_loading = false;
      A.licenses_error = "Ошибка запроса к /api/licenses.";
      try{
        if(typeof render === "function" && currentStep().key === "license_ids"){
          render();
        }
      }catch{}
      setHint(A.licenses_error);
      return false;
    }finally{
      if(useLoading) stopLoading();
    }
  }


  function mediaLabel(code){
    if(code === "auto") return "Автоматически (как указано в лицензиях)";
    if(code === "air") return "Эфирное вещание";
    if(code === "cable") return "Кабельное вещание";
    if(code === "both") return "Одновременно эфирное и кабельное вещание";
    return "Автоматически (как указано в лицензиях)";
  }

  function renderLicenseSelection(){
    const items = Array.isArray(A.licenses_all) ? A.licenses_all : [];
    if(items.length === 0 && A.inn && !A.licenses_loading){
      A.licenses_loading = true;
      A.licenses_error = null;
      if(!A._licenses_loading_ui){
        A._licenses_loading_ui = true;
        startLoading("Выполняется поиск лицензий. Это может занять несколько минут.", true);
      }
      setInputHtml("");
      setHint("");
      fetchLicenses(A.inn, {loading:false}).finally(()=>{
        A.licenses_loading = false;
        if(A._licenses_loading_ui){
          A._licenses_loading_ui = false;
          stopLoading();
        }
        renderLicenseSelection();

  let idx = 0;
  const history = [];

  function visibleStepsCount(){
    return steps.filter(s => (s.when ? s.when() : true)).length;
  }

  function updateProgress(){
    const total = visibleStepsCount();
    const currentVisibleIndex = Math.min(history.length + 1, total);
    const pct = Math.round((currentVisibleIndex / total) * 100);

    stepPill.textContent = `Шаг ${currentVisibleIndex}`;
    progressLabel.textContent = `${pct}%`;
    progressBar.style.width = `${pct}%`;
  }

  function currentStep(){ return steps[idx]; }

  function render(){
    let step = currentStep();
    while(step && step.when && !step.when()){
      idx++;
      step = currentStep();
    }

    setError("");
    qTitle.textContent = step.title;
    qText.textContent = step.text || "";
    setHint("");
    step.render?.();
    
    if(footerHelp){
    footerHelp.style.display = (step.key === "__finish__") ? "none" : "block";
    }
    updateSummary();
    updateProgress();

    backBtn.disabled = (history.length === 0);
    nextBtn.textContent = (step.key === "__finish__") ? "Рассчитать →" : "Далее →";
  }

  function applyValue(step, parsed){
    if(step.key === "__finish__") return;
    if(!A._doneSteps) A._doneSteps = {};
    A._doneSteps[step.key] = true;
    if(step.key === "license_ids"){
      A.license_ids = Array.isArray(parsed) ? parsed : [];
      if(A.population_by_license){
        const keep = new Set(A.license_ids);
        for(const k of Object.keys(A.population_by_license)){
          if(!keep.has(k)) delete A.population_by_license[k];
        }
      }
      return;
    }
    if(step.key === "min_calc_mode"){
      A.min_calc_mode = parsed;
      if(parsed === "subs"){
        A.population_mode = "auto";
        A.population_by_license = null;
      }else if(parsed === "pop"){
        A.subscriber_total = null;
      }
      return;
    }
    if(step.key === "population_mode"){
      A.population_mode = parsed;
      if(parsed === "auto"){
        A.population_by_license = null;
      }
      return;
    }
    if(step.key === "population_confirm"){
      A.population_by_license = parsed;
      return;
    }
    if(step.key === "population_by_license"){
      A.population_by_license = parsed;
      return;
    }
    A[step.key] = parsed;
  }

  function back(){
    if(history.length === 0) return;
    idx = history.pop();
    render();
  }

  function restart(){
    for(const k of Object.keys(A)) delete A[k];
    idx = 0;
    history.length = 0;
    output.textContent = "Результат появится здесь после завершения расчёта.";
    render();
  }

  async function runCalc(){
    output.textContent = "";
    startLoading("Выполняется расчёт…", true);
    spin.style.display = "inline-block";

    const payload = {
      inn: A.inn,
    
      annual_revenue: null,
      revenue_q: null,
      expenses_q: null,
    
      internet_resources: (A.internet_resources ?? 0),
      contract_media: (A.contract_media ?? "auto"),
    
      new_user: (A.worked_before === false),
      assoc_member: (A.assoc_member ?? false),

      only_license: (A.only_license ?? null),
      license_ids: (A.license_ids ?? null),
    
      subscriber_total: (A.min_calc_mode === "subs") ? (A.subscriber_total ?? null) : null,
      population_override: null,
      population_by_license: (A.min_calc_mode === "pop") ? (A.population_by_license ?? null) : null,
    
      small_income_mode: (A.small_income_mode ?? "auto"),
    };

    if(A.base_type === "annual_revenue") payload.annual_revenue = (A.annual_revenue ?? null);
    if(A.base_type === "revenue_q") payload.revenue_q = (A.revenue_q ?? null);
    if(A.base_type === "expenses_q") payload.expenses_q = (A.expenses_q ?? null);

    try{
      let res = await apiFetch(`${API_BASE}/api/calc`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
      if(!res && API_BASE !== API_FALLBACK){
        res = await apiFetch(`${API_FALLBACK}/api/calc`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(payload)
        });
      }

      if(!res){
        output.textContent = "Ошибка сети при обращении к /api/calc.";
        return;
      }

      const raw = await res.text();
      let text;
      
      try{
        const data = JSON.parse(raw);
        if(data && data.ok){
          text = data.text;
        }else{
          text = (data && data.error) ? data.error : raw;
        }
      }catch{
        // если сервер вернул не JSON (например, plain text/HTML)
        text = raw;
      }
      
      output.textContent = text;

    }catch(e){
      output.textContent = "Ошибка запроса к серверу: " + (e?.message ?? String(e));
    }finally{
      spin.style.display = "none";
      stopLoading();
    }
  }

 async function next(){
    let step = currentStep();
    while(step && step.when && !step.when()){
      idx++;
      step = currentStep();
    }

    if(step.key === "__finish__"){
      runCalc();
      return;
    }

    const v = getUserInput();
    const parsed = step.validate ? step.validate(v) : v;

    if(parsed === null){
  setError(step.error || "Проверь значение.");
  return;
}

  if(parsed === SKIP){
    // сохраняем как "нет данных" и идём дальше
    applyValue(step, null);
    if(step.key === "subscriber_total"){
      A.min_calc_mode = "pop";
    }
  
    // если это финансовый шаг и пользователь поставил "-" → считаем что финансовой базы нет
    if(step.key === "revenue_q" || step.key === "annual_revenue" || step.key === "expenses_q"){
      A.revenue_q = null;
      A.annual_revenue = null;
      A.expenses_q = null;
      A.base_type = null; // эквивалент "Нет данных"
    }
  
    history.push(idx);

    idx++;
    render();
    return;
}

    applyValue(step, parsed);

    if(step.key === "inn") {
      setError("");
      setHint("Выполняется поиск организации по ИНН…");
      nextBtn.disabled = true;
      startLoading("Выполняется поиск организации и лицензий…", true);

    try{
    // чтобы не висеть бесконечно — таймаут 5 секунд
    setHint("Выполняется поиск организации по ИНН…");

    await Promise.race([
      Promise.all([fetchInnInfo(parsed, {loading:false}), fetchLicenses(parsed, {loading:false})]),
      new Promise((_, reject)=> setTimeout(()=> reject(new Error("timeout")), 5000))
    ]);
  }catch(e){
    // если таймаут/ошибка — просто продолжаем дальше
    // (название может подгрузиться позже или не найтись)
  }finally{
    stopLoading();
    nextBtn.disabled = false;
  }
}

    
    history.push(idx);
    idx++;
    render();
    }


  backBtn.addEventListener("click", back);
  nextBtn.addEventListener("click", next);
  restartBtn.addEventListener("click", restart);

  copyBtn.addEventListener("click", async ()=>{
    try{
      await navigator.clipboard.writeText(output.textContent || "");
      copyBtn.textContent = "Скопировано";
      setTimeout(()=> copyBtn.textContent = "Скопировать", 900);
    }catch{
      const ta = document.createElement("textarea");
      ta.value = output.textContent || "";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      copyBtn.textContent = "Скопировано";
      setTimeout(()=> copyBtn.textContent = "Скопировать", 900);
    }
  });

  render();
</script>
</body>
</html>
