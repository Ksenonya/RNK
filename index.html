
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAO — Расчёт</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1a2d;
      --text:#e8eefc;
      --muted:#a8b4d6;
      --line:rgba(255,255,255,.10);
      --accent:#4f8cff;
      --accent2:#2dd4bf;
      --danger:#ff5a6b;
      --shadow: 0 18px 45px rgba(0,0,0,.35);
      --radius: 16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 700px at 10% 0%, rgba(79,140,255,.18), transparent 55%),
        radial-gradient(1000px 600px at 90% 20%, rgba(45,212,191,.14), transparent 55%),
        var(--bg);
      color:var(--text);
    }
    .wrap{ max-width: 1060px; margin: 28px auto; padding: 0 16px; }
    .topbar{ display:flex; gap:16px; align-items:flex-start; justify-content:space-between; margin-bottom: 16px; }
    .brand{ display:flex; flex-direction:column; gap:6px; }
    .brand h1{ font-size: 20px; margin:0; letter-spacing:.2px; }
    .brand p{ margin:0; color:var(--muted); font-size: 14px; line-height: 1.35; }
    .grid{ display:grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
    @media (max-width: 920px){ .grid{ grid-template-columns:1fr; } }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .head{ padding: 16px 16px 12px 16px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.15); }
    .card .body{ padding: 16px; }

    .progressRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top: 10px; }
    .progress{ flex:1; height: 10px; background: rgba(255,255,255,.08); border-radius: 999px; overflow:hidden; border: 1px solid rgba(255,255,255,.06); }
    .progress > div{ height:100%; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .25s ease; }
    .progressLabel{ font-size: 12px; color:var(--muted); white-space:nowrap; }

    .questionTitle{ font-size: 16px; margin: 0 0 8px 0; }
    .questionText{ margin: 0 0 14px 0; color: var(--muted); font-size: 14px; line-height: 1.45; }

    label{ display:block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    input, select{
      width:100%;
      padding: 12px 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      color: var(--text);
      outline:none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder{ color: rgba(168,180,214,.65); }
    input:focus, select:focus{ border-color: rgba(79,140,255,.55); box-shadow: 0 0 0 4px rgba(79,140,255,.12); }

    .error{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,90,107,.35);
      background: rgba(255,90,107,.10);
      color: #ffd2d8;
      font-size: 13px;
      display:none;
    }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px; }
    .btn{
      appearance:none; border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 600;
      font-size: 14px;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.09); }
    .btn:active{ transform: translateY(1px); }
    .btn[disabled]{ opacity:.5; cursor:not-allowed; }
    .btnPrimary{ background: linear-gradient(90deg, rgba(79,140,255,.95), rgba(45,212,191,.70)); border-color: rgba(255,255,255,.10); color: #08101f; }
    .btnGhost{ background: transparent; }
    .btnDanger{ border-color: rgba(255,90,107,.28); background: rgba(255,90,107,.10); color:#ffd2d8; }

    .pill{
      display:inline-flex; align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-size: 12px;
      gap: 8px;
    }

    .kv{ display:grid; grid-template-columns: 1fr; gap:10px; }
    .kv .item{ padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.18); }
    .kv .k{ font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .kv .v{ font-size: 14px; color: var(--text); word-break: break-word; }

    pre{
      margin:0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.25);
      white-space: pre-wrap;
      min-height: 140px;
      color: #dfe8ff;
      font-size: 13px;
      line-height: 1.35;
    }
    .row2{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 10px; }
    .spinner{
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: rgba(255,255,255,.85);
      border-radius: 999px;
      animation: spin .8s linear infinite;
      display:none;
    }
    @keyframes spin{ to{ transform: rotate(360deg);} }
    .muted{ color: var(--muted); font-size: 13px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1>RAO — Расчёт (веб-форма)</h1>
        <p>Пошаговый ввод данных. Пустое поле <b>или</b> «- / — / нет» = <b>нет данных</b>.</p>
      </div>
      <div class="pill">API: /api/calc</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="head">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
            <div class="pill" id="stepPill">Шаг 1</div>
            <div class="progressLabel" id="progressLabel">0%</div>
          </div>
          <div class="progressRow">
            <div class="progress"><div id="progressBar"></div></div>
          </div>
        </div>

        <div class="body">
          <h2 class="questionTitle" id="qTitle">Вопрос</h2>
          <p class="questionText" id="qText"></p>

          <div id="inputBox"></div>
          <div class="error" id="errBox"></div>

          <div class="actions">
            <button class="btn btnGhost" id="backBtn">← Назад</button>
            <button class="btn btnPrimary" id="nextBtn">Далее →</button>
            <button class="btn btnDanger" id="restartBtn">Начать заново</button>
          </div>

          <div class="muted" style="margin-top:14px;">
            Подсказка: <b>Enter</b> = далее. «-» или пусто = пропустить (если поле опциональное).
          </div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="card">
          <div class="head">
            <div class="row2">
              <div class="pill">Введённые данные</div>
              <div class="muted">Заполняй шаги слева</div>
            </div>
          </div>
          <div class="body">
            <div class="kv" id="summary"></div>
          </div>
        </div>

        <div class="card">
          <div class="head">
            <div class="row2">
              <div class="pill">Результат</div>
              <div style="display:flex; align-items:center; gap:10px;">
                <div class="spinner" id="spin"></div>
                <button class="btn" id="copyBtn">Скопировать</button>
              </div>
            </div>
          </div>
          <div class="body">
            <pre id="output">Результат появится здесь после расчёта.</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const A = {};

  const qTitle = document.getElementById("qTitle");
  const qText  = document.getElementById("qText");
  const inputBox = document.getElementById("inputBox");
  const errBox = document.getElementById("errBox");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const summary = document.getElementById("summary");
  const output = document.getElementById("output");
  const spin = document.getElementById("spin");

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function isEmptyOrDash(v){
    if(v == null) return true;
    const s = String(v).trim().toLowerCase();
    return s === "" || s === "-" || s === "—" || s === "–" || s === "нет";
  }

  function parseFloatMaybe(v){
    if(isEmptyOrDash(v)) return null;
    const s = String(v).trim().replace(/\s+/g,"").replace(",",".");
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  }

  function parseIntMaybe(v){
    if(isEmptyOrDash(v)) return null;
    const s = String(v).trim().replace(/\s+/g,"");
    const n = Number(s);
    if(!Number.isFinite(n)) return null;
    return Math.trunc(n);
  }

  function setInputText({label, placeholder="", value=""}){
    inputBox.innerHTML = `
      <label>${label}</label>
      <input id="userInput" type="text" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(String(value ?? ""))}"/>
    `;
    const el = document.getElementById("userInput");
    el.focus();
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); nextBtn.click(); }
    });
  }

  function setInputSelect({label, choices, value}){
    const opts = choices.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    inputBox.innerHTML = `
      <label>${label}</label>
      <select id="userInput">${opts}</select>
    `;
    const el = document.getElementById("userInput");
    if(value != null) el.value = value;
    el.focus();
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); nextBtn.click(); }
    });
  }

  function getUserInput(){
    const el = document.getElementById("userInput");
    if(!el) return "";
    return el.value ?? "";
  }

  function setError(msg){
    errBox.textContent = msg || "";
  }

  function updateSummary(){
    const baseLabel =
      (A.base_type === "annual_revenue") ? "Годовая выручка/доход" :
      (A.base_type === "revenue_q") ? "Доходы за квартал" :
      (A.base_type === "expenses_q") ? "Расходы за квартал" :
      "Финансовая база";

    const baseValue =
      (A.base_type === "revenue_q") ? A.revenue_q :
      (A.base_type === "annual_revenue") ? A.annual_revenue :
      (A.base_type === "expenses_q") ? A.expenses_q :
      "не указана";

    const items = [
      ["ИНН", A.inn],
      [baseLabel, baseValue],
      ["Интернет-ресурсы", A.internet_resources],
      ["Ранее работал с РАО?", (A.worked_before===true ? "Да" : (A.worked_before===false ? "Нет" : undefined))],
      ...(A.worked_before===false ? [["Квартал договора", A.contract_quarter]] : []),
      ["Среда договора", (()=>{
        const v = (A.contract_media ?? "auto");
        return (v==="auto") ? "Авто (как в лицензиях)" :
               (v==="air") ? "В эфире" :
               (v==="cable") ? "По кабелю" :
               "Одновременно в эфире и по кабелю";
      })()],
      ["Член ассоциации", (A.assoc_member===true ? "Да" : (A.assoc_member===false ? "Нет" : undefined))],
      ["Ветка малого дохода", A.small_income_mode],
      ["Только лицензия", A.only_license],
      ["Население (override)", A.population_override],
      ["Есть платежи за прошлый год", (A.have_past===true ? "Да" : (A.have_past===false ? "Нет" : undefined))],
      ["Сумма платежей за прошлый год", A.past_year_percent_paid],
    ];

    const rows = items
      .filter(([_,v]) => v !== undefined && v !== null && v !== "")
      .map(([k,v]) => `
        <div class="row">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `).join("");

    summary.innerHTML = rows || `<div class="muted">Пока ничего нет. Заполни первый шаг.</div>`;
  }

  const steps = [
    {
      key:"inn",
      title:"ИНН организации",
      text:"Введите ИНН (10 или 12 цифр, без пробелов).",
      render: ()=> setInputText({label:"ИНН", placeholder:"например 0326499787"}),
      validate: (v)=> (/^\d{10}$|^\d{12}$/.test(v.trim()) ? v.trim() : null),
      error: "ИНН должен состоять из 10 или 12 цифр."
    },
    {
      key:"base_type",
      title:"Финансовая база",
      text:"Что есть у пользователя для расчёта процента?",
      render: ()=> setInputSelect({
        label:"Выберите базу",
        choices:[
          "Доходы за квартал",
          "Годовая выручка/доход",
          "Расходы за квартал (если нет доходов)",
          "Нет данных"
        ],
        value: (A.base_type === "revenue_q") ? "Доходы за квартал"
             : (A.base_type === "annual_revenue") ? "Годовая выручка/доход"
             : (A.base_type === "expenses_q") ? "Расходы за квартал (если нет доходов)"
             : "Нет данных"
      }),
      validate: (v)=>{
        if(v === "Доходы за квартал") return "revenue_q";
        if(v === "Годовая выручка/доход") return "annual_revenue";
        if(v === "Расходы за квартал (если нет доходов)") return "expenses_q";
        if(v === "Нет данных") return null;
        return null;
      },
      error:"Выберите вариант."
    },
    {
      key:"revenue_q",
      title:"Доходы за квартал",
      text:"Введите доходы за квартал (число ≥ 0). Пусто/«-» = нет данных.",
      when: ()=> A.base_type === "revenue_q",
      render: ()=> setInputText({label:"Доход за квартал", placeholder:"например 1250000 (пусто или - = нет данных)"}),
      validate: (v)=>{
        const n = parseFloatMaybe(v);
        if(n === null) return null;
        if(!Number.isFinite(n) || n < 0) return null;
        return n;
      },
      error:"Введите число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"annual_revenue",
      title:"Годовая выручка",
      text:"Введите сумму годовой выручки/дохода (число ≥ 0). Пусто/«-» = нет данных.",
      when: ()=> A.base_type === "annual_revenue",
      render: ()=> setInputText({label:"Годовая выручка", placeholder:"например 5000000 (пусто или - = нет данных)"}),
      validate: (v)=>{
        const n = parseFloatMaybe(v);
        if(n === null) return null;
        if(!Number.isFinite(n) || n < 0) return null;
        return n;
      },
      error:"Введите число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"expenses_q",
      title:"Расходы за квартал",
      text:"Введите расходы за квартал (число ≥ 0). Пусто/«-» = нет данных.",
      when: ()=> A.base_type === "expenses_q",
      render: ()=> setInputText({label:"Расходы за квартал", placeholder:"например 900000 (пусто или - = нет данных)"}),
      validate: (v)=>{
        const n = parseFloatMaybe(v);
        if(n === null) return null;
        if(!Number.isFinite(n) || n < 0) return null;
        return n;
      },
      error:"Введите число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"internet_resources",
      title:"Интернет-ресурсы",
      text:"Сколько интернет-ресурсов (0–1000)?",
      render: ()=> setInputText({label:"Интернет-ресурсы", placeholder:"0", value: (A.internet_resources ?? 0)}),
      validate: (v)=>{
        const n = parseIntMaybe(v);
        if(!Number.isInteger(n) || n < 0 || n > 1000) return null;
        return n;
      },
      error:"Введите целое число от 0 до 1000."
    },
    {
      key:"worked_before",
      title:"Пользователь ранее работал с РАО?",
      text:"Если пользователь уже заключал договор(ы) с РАО раньше — выбери «Да». Если это первый договор — «Нет».",
      render: ()=> setInputSelect({label:"Ранее работал с РАО?", choices:["Да","Нет"], value:(A.worked_before === true ? "Да" : "Нет")}),
      validate: (v)=> (v === "Да"),
      error:"Выберите «Да» или «Нет»."
    },
    {
      key:"contract_quarter",
      title:"Квартал договора",
      text:"Номер квартала действия договора (1–4). Этот вопрос нужен только для нового пользователя.",
      when: ()=> A.worked_before === false,
      render: ()=> setInputSelect({label:"Квартал договора", choices:["1","2","3","4"], value: String(A.contract_quarter ?? 1)}),
      validate: (v)=> parseInt(v,10),
      error:"Выберите квартал 1–4."
    },
    {
      key:"contract_media",
      title:"Среда договора",
      text:"Выберите среду договора (влияет на минимальную сумму).",
      render: ()=> setInputSelect({label:"Среда договора", choices:[
        "Авто (как в лицензиях)",
        "В эфире",
        "По кабелю",
        "Одновременно в эфире и по кабелю"
      ], value: (()=>{
        const v = (A.contract_media ?? "auto");
        return (v==="auto") ? "Авто (как в лицензиях)" :
               (v==="air") ? "В эфире" :
               (v==="cable") ? "По кабелю" :
               "Одновременно в эфире и по кабелю";
      })()}),
      validate: (v)=>{
        if(v === "Авто (как в лицензиях)") return "auto";
        if(v === "В эфире") return "air";
        if(v === "По кабелю") return "cable";
        if(v === "Одновременно в эфире и по кабелю") return "both";
        return null;
      },
      error:"Выберите один из вариантов."
    },
    {
      key:"small_income_mode",
      title:"Ветка малого дохода",
      text:"Оставить авто-выбор ветки малого дохода, либо принудительно включить/выключить?",
      render: ()=> setInputSelect({label:"Режим", choices:["auto","force_on","force_off"], value:(A.small_income_mode ?? "auto")}),
      validate: (v)=> ["auto","force_on","force_off"].includes(v) ? v : null,
      error:"Выберите: auto / force_on / force_off."
    },
    {
      key:"only_license",
      title:"Ограничение лицензией",
      text:"Если нужно посчитать только одну лицензию — введите её ID. Иначе оставьте пустым или поставьте «-».",
      render: ()=> setInputText({label:"Только лицензия (опционально)", placeholder:"ID лицензии или пусто / -"}),
      validate: (v)=> isEmptyOrDash(v) ? null : v.trim()
    },
    {
      key:"population_override",
      title:"Территория отличается от заявленной в лицензии?",
      text:"Если фактическая территория отличается от заявленной в лицензии — введите население территории вещания. Иначе оставьте пустым или поставьте «-».",
      render: ()=> setInputText({label:"Население (опционально)", placeholder:"например 978500 (пусто / - = нет данных)"}),
      validate: (v)=>{
        if(isEmptyOrDash(v)) return null;
        const n = parseIntMaybe(v);
        if(!Number.isInteger(n) || n < 0) return null;
        return n;
      },
      error:"Введите целое число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"have_past",
      title:"Платежи за прошлый год",
      text:"Есть сумма фактических платежей по проценту за прошлый год (для правила «гильотины»)?",
      render: ()=> setInputSelect({label:"Есть данные?", choices:["Нет","Да"], value:"Нет"}),
      validate: (v)=> (v === "Да"),
    },
    {
      key:"past_year_percent_paid",
      title:"Сумма платежей за прошлый год",
      text:"Введите сумму (число ≥ 0). Пусто/«-» = нет данных.",
      when: ()=> A.have_past === true,
      render: ()=> setInputText({label:"Платежи за прошлый год", placeholder:"например 150000 (пусто / - = нет данных)"}),
      validate: (v)=>{
        const n = parseFloatMaybe(v);
        if(n === null) return null;
        if(!Number.isFinite(n) || n < 0) return null;
        return n;
      },
      error:"Введите число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"assoc_member",
      title:"Член отраслевой ассоциации?",
      text:"Является ли пользователь членом отраслевой ассоциации (применяется понижающий коэффициент к минимальной сумме)?",
      render: ()=> setInputSelect({label:"Член ассоциации?", choices:["Нет","Да"], value:(A.assoc_member === true ? "Да" : "Нет")}),
      validate: (v)=> (v === "Да"),
      error:"Выберите «Да» или «Нет»."
    },
    {
      key:"__finish__",
      title:"Готово к расчёту",
      text:"Проверь данные справа. Нажми «Далее» — запущу расчёт и покажу результат.",
      render: ()=> { inputBox.innerHTML = `<div class="muted">Нажмите «Далее», чтобы выполнить расчёт.</div>`; },
      validate: ()=> "__finish__"
    },
  ];

  let idx = 0;
  const history = [];

  function currentStep(){ return steps[idx]; }

  function updateProgress(){
    const stepNo = history.length + 1;
    const total = steps.filter(s => (s.when ? s.when() : true)).length;
    document.getElementById("progressText").textContent = `Шаг ${Math.min(stepNo,total)} из ${total}`;
    document.getElementById("progressLine").style.width = `${Math.min(100, Math.round((Math.min(stepNo,total)/total)*100))}%`;
  }

  function render(){
    const step = currentStep();
    if(step.when && !step.when()){
      idx++;
      return render();
    }
    qTitle.textContent = step.title;
    qText.textContent = step.text || "";
    setError("");

    step.render?.();

    updateSummary();
    updateProgress();

    prevBtn.disabled = history.length === 0;
    nextBtn.textContent = (step.key === "__finish__") ? "Рассчитать" : "Далее";
  }

  function applyValue(step, raw){
    if(step.key === "__finish__") return;
    A[step.key] = raw;
  }

  function back(){
    if(history.length === 0) return;
    const prev = history.pop();
    idx = prev;
    render();
  }

  async function runCalc(){
    output.textContent = "";
    spin.style.display = "inline-block";

    const payload = {
      inn: A.inn,

      annual_revenue: (A.annual_revenue ?? null),
      revenue_q: (A.revenue_q ?? null),
      expenses_q: (A.expenses_q ?? null),

      internet_resources: (A.internet_resources ?? 0),

      contract_quarter: (A.worked_before === false ? (A.contract_quarter ?? 1) : 1),
      contract_media: (A.contract_media ?? "auto"),

      new_user: (A.worked_before === false),
      assoc_member: (A.assoc_member ?? false),

      only_license: (A.only_license ?? null),
      population_override: (A.population_override ?? null),
      past_year_percent_paid: (A.past_year_percent_paid ?? null),

      small_income_mode: (A.small_income_mode ?? "auto"),
    };

    if(A.base_type === "annual_revenue") payload.annual_revenue = A.annual_revenue ?? null;
    if(A.base_type === "revenue_q") payload.revenue_q = A.revenue_q ?? null;
    if(A.base_type === "expenses_q") payload.expenses_q = A.expenses_q ?? null;

    try{
      const res = await fetch("/api/calc", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });

      let text;
      try{
        const data = await res.json();
        if(data && data.ok){
          text = data.text;
        }else{
          text = (data && data.error) ? data.error : JSON.stringify(data, null, 2);
        }
      }catch{
        text = await res.text();
      }
      output.textContent = text;

    }catch(e){
      output.textContent = "Ошибка запроса к серверу: " + (e?.message ?? String(e));
    }finally{
      spin.style.display = "none";
    }
  }

  function next(){
    const step = currentStep();
    if(step.when && !step.when()){
      idx++;
      return next();
    }

    if(step.key === "__finish__"){
      runCalc();
      return;
    }

    const v = getUserInput();
    const parsed = step.validate ? step.validate(v) : v;

    if(parsed === null){
      setError(step.error || "Проверь значение.");
      return;
    }

    applyValue(step, parsed);
    history.push(idx);
    idx++;

    render();
  }

  prevBtn.addEventListener("click", back);
  nextBtn.addEventListener("click", next);

  render();
</script>
</body>
</html>
