
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAO — Расчёт</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1a2d;
      --text:#e8eefc;
      --muted:#a8b4d6;
      --line:rgba(255,255,255,.10);
      --accent:#4f8cff;
      --accent2:#2dd4bf;
      --danger:#ff5a6b;
      --shadow: 0 18px 45px rgba(0,0,0,.35);
      --radius: 16px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 700px at 10% 0%, rgba(79,140,255,.18), transparent 55%),
        radial-gradient(1000px 600px at 90% 20%, rgba(45,212,191,.14), transparent 55%),
        var(--bg);
      color:var(--text);
    }
    .wrap{ max-width: 1060px; margin: 28px auto; padding: 0 16px; }
    .topbar{ display:flex; gap:16px; align-items:flex-start; justify-content:space-between; margin-bottom: 16px; }
    .brand{ display:flex; flex-direction:column; gap:6px; }
    .brand h1{ font-size: 20px; margin:0; letter-spacing:.2px; }
    .brand p{ margin:0; color:var(--muted); font-size: 14px; line-height: 1.35; }
    .grid{ display:grid; grid-template-columns: 1.1fr .9fr; gap: 16px; }
    @media (max-width: 920px){ .grid{ grid-template-columns:1fr; } }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card .head{ padding: 16px 16px 12px 16px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,.15); }
    .card .body{ padding: 16px; }

    .progressRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top: 10px; }
    .progress{ flex:1; height: 10px; background: rgba(255,255,255,.08); border-radius: 999px; overflow:hidden; border: 1px solid rgba(255,255,255,.06); }
    .progress > div{ height:100%; width:0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .25s ease; }
    .progressLabel{ font-size: 12px; color:var(--muted); white-space:nowrap; }

    .questionTitle{ font-size: 16px; margin: 0 0 8px 0; }
    .questionText{ margin: 0 0 14px 0; color: var(--muted); font-size: 14px; line-height: 1.45; }

    label{ display:block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    input, select{
      width:100%;
      padding: 12px 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      color: var(--text);
      outline:none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder{ color: rgba(168,180,214,.65); }
    input:focus, select:focus{ border-color: rgba(79,140,255,.55); box-shadow: 0 0 0 4px rgba(79,140,255,.12); }

    .error{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,90,107,.35);
      background: rgba(255,90,107,.10);
      color: #ffd2d8;
      font-size: 13px;
      display:none;
    }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px; }
    .btn{
      appearance:none; border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 600;
      font-size: 14px;
      transition: transform .06s ease, background .15s ease, border-color .15s ease;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.09); }
    .btn:active{ transform: translateY(1px); }
    .btn[disabled]{ opacity:.5; cursor:not-allowed; }
    .btnPrimary{ background: linear-gradient(90deg, rgba(79,140,255,.95), rgba(45,212,191,.70)); border-color: rgba(255,255,255,.10); color: #08101f; }
    .btnGhost{ background: transparent; }
    .btnDanger{ border-color: rgba(255,90,107,.28); background: rgba(255,90,107,.10); color:#ffd2d8; }

    .pill{
      display:inline-flex; align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--muted);
      font-size: 12px;
      gap: 8px;
    }

    .kv{ display:grid; grid-template-columns: 1fr; gap:10px; }
    .kv .item{ padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.18); }
    .kv .k{ font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .kv .v{ font-size: 14px; color: var(--text); word-break: break-word; }

    pre{
      margin:0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.25);
      white-space: pre-wrap;
      min-height: 140px;
      color: #dfe8ff;
      font-size: 13px;
      line-height: 1.35;
    }
    .row2{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom: 10px; }
    .spinner{
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: rgba(255,255,255,.85);
      border-radius: 999px;
      animation: spin .8s linear infinite;
      display:none;
    }
    @keyframes spin{ to{ transform: rotate(360deg);} }
    .muted{ color: var(--muted); font-size: 13px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1>RAO — Расчёт (веб-форма)</h1>
        <p>Пошаговый ввод данных. Пустое поле <b>или</b> «- / — / нет» = <b>нет данных</b>.</p>
      </div>
      <div class="pill">API: /api/calc</div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="head">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
            <div class="pill" id="stepPill">Шаг 1</div>
            <div class="progressLabel" id="progressLabel">0%</div>
          </div>
          <div class="progressRow">
            <div class="progress"><div id="progressBar"></div></div>
          </div>
        </div>

        <div class="body">
          <h2 class="questionTitle" id="qTitle">Вопрос</h2>
          <p class="questionText" id="qText"></p>

          <div id="inputBox"></div>
          <div class="error" id="errBox"></div>

          <div class="actions">
            <button class="btn btnGhost" id="backBtn">← Назад</button>
            <button class="btn btnPrimary" id="nextBtn">Далее →</button>
            <button class="btn btnDanger" id="restartBtn">Начать заново</button>
          </div>

          <div class="muted" style="margin-top:14px;">
            Подсказка: <b>Enter</b> = далее. «-» или пусто = пропустить (если поле опциональное).
          </div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="card">
          <div class="head">
            <div class="row2">
              <div class="pill">Введённые данные</div>
              <div class="muted">Заполняй шаги слева</div>
            </div>
          </div>
          <div class="body">
            <div class="kv" id="summary"></div>
          </div>
        </div>

        <div class="card">
          <div class="head">
            <div class="row2">
              <div class="pill">Результат</div>
              <div style="display:flex; align-items:center; gap:10px;">
                <div class="spinner" id="spin"></div>
                <button class="btn" id="copyBtn">Скопировать</button>
              </div>
            </div>
          </div>
          <div class="body">
            <pre id="output">Результат появится здесь после расчёта.</pre>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const A = {};

  const qTitle = document.getElementById("qTitle");
  const qText  = document.getElementById("qText");
  const inputBox = document.getElementById("inputBox");
  const errBox = document.getElementById("errBox");
  const backBtn = document.getElementById("backBtn");
  const nextBtn = document.getElementById("nextBtn");
  const restartBtn = document.getElementById("restartBtn");
  const stepPill = document.getElementById("stepPill");
  const progressBar = document.getElementById("progressBar");
  const progressLabel = document.getElementById("progressLabel");
  const summary = document.getElementById("summary");
  const output = document.getElementById("output");
  const copyBtn = document.getElementById("copyBtn");
  const spin = document.getElementById("spin");

  function showError(msg){
    if(!msg){ errBox.style.display="none"; errBox.textContent=""; return; }
    errBox.style.display="block";
    errBox.textContent = msg;
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // === Главное исправление: "пусто" / "-" / "—" / "нет" считаем как null ===
  function isEmptyOrDash(v){
    const s = String(v ?? "").trim();
    return s === "" || s === "-" || s === "—" || s.toLowerCase() === "нет";
  }

  function parseIntMaybe(s){
    if(isEmptyOrDash(s)) return null;
    const t = String(s).trim().replace(/\s+/g,"");
    if(!/^-?\d+$/.test(t)) return NaN;
    return parseInt(t,10);
  }

  function parseFloatMaybe(s){
    if(isEmptyOrDash(s)) return null;
    const t = String(s).trim().replace(/\s+/g,"").replace(",",".");
    const v = Number(t);
    return Number.isFinite(v) ? v : NaN;
  }

  function setInputText({label, placeholder="", value=""}){
    inputBox.innerHTML = `
      <label>${label}</label>
      <input id="userInput" type="text" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(String(value ?? ""))}"/>
    `;
    const el = document.getElementById("userInput");
    el.focus();
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); nextBtn.click(); }
    });
  }

  function setInputSelect({label, choices, value}){
    const opts = choices.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    inputBox.innerHTML = `
      <label>${label}</label>
      <select id="userInput">${opts}</select>
    `;
    const el = document.getElementById("userInput");
    if(value != null) el.value = value;
    el.focus();
    el.addEventListener("keydown", (e)=>{
      if(e.key === "Enter"){ e.preventDefault(); nextBtn.click(); }
    });
  }

  function getInputValue(){
    const el = document.getElementById("userInput");
    if(!el) return "";
    return el.value ?? "";
  }

  function updateSummary(){
    const baseLabel =
      (A.base_type === "revenue_q") ? "Доход за квартал" :
      (A.base_type === "annual_revenue") ? "Годовая выручка" :
      (A.base_type === "expenses_q") ? "Расходы за квартал" :
      "Финансовая база";

    const baseValue =
      (A.base_type === "revenue_q") ? A.revenue_q :
      (A.base_type === "annual_revenue") ? A.annual_revenue :
      (A.base_type === "expenses_q") ? A.expenses_q :
      "не указана";

    const items = [
      ["ИНН", A.inn],
      ["Год", A.year],
      [baseLabel, baseValue],
      ["Интернет-ресурсы", A.internet_resources],
      ["Квартал договора", A.contract_quarter],
      ["Среда договора", A.contract_media],
      ["Ветка малого дохода", A.small_income_mode],
      ["Новый пользователь", (A.new_user === true ? "Да" : (A.new_user === false ? "Нет" : undefined))],
      ["Только лицензия", A.only_license],
      ["Население (override)", A.population_override],
      ["Платежи за прошлый год", A.past_year_percent_paid],
    ];

    summary.innerHTML = items
      .filter(([k,v]) => v !== undefined && v !== null && String(v).length)
      .map(([k,v]) => `
        <div class="item">
          <div class="k">${escapeHtml(k)}</div>
          <div class="v">${escapeHtml(v)}</div>
        </div>
      `).join("");

    if(!summary.innerHTML){
      summary.innerHTML = `<div class="muted">Пока ничего нет. Заполни первый шаг.</div>`;
    }
  }

  const steps = [
    {
      key:"inn",
      title:"ИНН организации",
      text:"Введите ИНН (10 или 12 цифр, без пробелов).",
      render: ()=> setInputText({label:"ИНН", placeholder:"например 0326499787"}),
      validate: (v)=> (/^\d{10}$|^\d{12}$/.test(v.trim()) ? v.trim() : null),
      error: "ИНН должен состоять из 10 или 12 цифр."
    },
    {
      key:"new_user",
      title:"Новый пользователь?",
      text:"Это первый лицензионный договор с РАО (льгота по минимальной сумме в первые периоды)?",
      render: ()=> setInputSelect({label:"Новый пользователь", choices:["Нет","Да"], value:"Нет"}),
      validate: (v)=> (v === "Да"),  // вернёт true/false
      error:""
    },
    {
      key:"year",
      title:"Год расчёта",
      text:"Введите год (например 2024). Можно оставить пустым или поставить «-».",
      render: ()=> setInputText({label:"Год", placeholder:"например 2024 (пусто или - = нет данных)"}),
      validate: (v)=>{
        if(isEmptyOrDash(v)) return null;
        const n = parseIntMaybe(v);
        if(!Number.isInteger(n) || n < 1900 || n > 2100) return null;
        return n;
      },
      error:"Введите год числом от 1900 до 2100, или оставьте пустым/«-»."
    },
    {
      key:"base_type",
      title:"Финансовая база",
      text:"Выберите, от чего считаем процент: доходы за квартал / годовая выручка / расходы за квартал (ветка госструктуры) / нет данных.",
      render: ()=> setInputSelect({
        label:"Тип базы",
        choices:[
          "Доход за квартал",
          "Годовая выручка",
          "Расходы за квартал (госструктура)",
          "Нет данных"
        ],
        value: "Доход за квартал"
      }),
      validate: (v)=>{
        if(v === "Доход за квартал") return "revenue_q";
        if(v === "Годовая выручка") return "annual_revenue";
        if(v === "Расходы за квартал (госструктура)") return "expenses_q";
        if(v === "Нет данных") return "none";
        return null;
      },
      error:"Выберите вариант базы."
    },
    {
      key:"revenue_q",
      title:"Доход за квартал",
      text:"Введите сумму дохода за квартал (число ≥ 0). Пусто/«-» = нет данных.",
      when: ()=> A.base_type === "revenue_q",
      render: ()=> setInputText({label:"Доход за квартал", placeholder:"например 1250000 (пусто или - = нет данных)"}),
      validate: (v)=>{
        const n = parseFloatMaybe(v);
        if(n === null) return null;
        if(!Number.isFinite(n) || n < 0) return null;
        return n;
      },
      error:"Введите число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"annual_revenue",
      title:"Годовая выручка",
      text:"Введите сумму годовой выручки/дохода (число ≥ 0). Пусто/«-» = нет данных.",
      when: ()=> A.base_type === "annual_revenue",
      render: ()=> setInputText({label:"Годовая выручка", placeholder:"например 33986000 (пусто или - = нет данных)"}),
      validate: (v)=>{
        const n = parseFloatMaybe(v);
        if(n === null) return null;
        if(!Number.isFinite(n) || n < 0) return null;
        return n;
      },
      error:"Введите число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"expenses_q",
      title:"Расходы за квартал",
      text:"Введите сумму расходов за квартал (число ≥ 0). Используется только если выбрана база «расходы». Пусто/«-» = нет данных.",
      when: ()=> A.base_type === "expenses_q",
      render: ()=> setInputText({label:"Расходы за квартал", placeholder:"например 1234567 (пусто или - = нет данных)"}),
      validate: (v)=>{
        const n = parseFloatMaybe(v);
        if(n === null) return null;
        if(!Number.isFinite(n) || n < 0) return null;
        return n;
      },
      error:"Введите число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"internet_resources",
      title:"Интернет-ресурсы",
      text:"Количество интернет-ресурсов со стримингом. Если нет — 0.",
      render: ()=> setInputText({label:"Интернет-ресурсы", placeholder:"0", value: (A.internet_resources ?? 0)}),
      validate: (v)=>{
        // для этого поля пусто/«-» не разрешаем — пусть будет 0
        const n = parseIntMaybe(v);
        if(!Number.isInteger(n) || n < 0 || n > 1000) return null;
        return n;
      },
      error:"Введите целое число от 0 до 1000."
    },
    {
      key:"contract_quarter",
      title:"Квартал договора",
      text:"Номер квартала действия договора (1–4).",
      render: ()=> setInputSelect({label:"Квартал договора", choices:["1","2","3","4"], value: String(A.contract_quarter ?? 1)}),
      validate: (v)=> parseInt(v,10),
    },
    {
      key:"contract_media",
      title:"Среда договора",
      text:"Выберите среду договора (влияет на минималку).",
      render: ()=> setInputSelect({label:"Среда договора", choices:["auto","cable","air","both"], value:(A.contract_media ?? "auto")}),
      validate: (v)=> ["auto","cable","air","both"].includes(v) ? v : null,
      error:"Выберите: auto/cable/air/both."
    },
    {
      key:"small_income_mode",
      title:"Ветка малого дохода",
      text:"Оставить авто-режим или принудительно включить/выключить ветку малого дохода.",
      render: ()=> setInputSelect({label:"Режим", choices:["auto","force_on","force_off"], value:(A.small_income_mode ?? "auto")}),
      validate: (v)=> ["auto","force_on","force_off"].includes(v) ? v : null,
      error:"Выберите: auto / force_on / force_off."
    },
    {
      key:"only_license",
      title:"Ограничение лицензией",
      text:"Если нужно посчитать только одну лицензию — введите её ID. Иначе оставьте пустым или поставьте «-».",
      render: ()=> setInputText({label:"Только лицензия (опционально)", placeholder:"ID лицензии или пусто / -"}),
      validate: (v)=> isEmptyOrDash(v) ? null : v.trim()
    },
    {
      key:"population_override",
      title:"Территория по письму",
      text:"Если фактическая территория отличается от РКН — введите население. Иначе оставьте пустым или поставьте «-».",
      render: ()=> setInputText({label:"Население (опционально)", placeholder:"например 978500 (пусто / - = нет данных)"}),
      validate: (v)=>{
        if(isEmptyOrDash(v)) return null;
        const n = parseIntMaybe(v);
        if(!Number.isInteger(n) || n < 0 || n > 2000000000) return null;
        return n;
      },
      error:"Введите целое число населения, или оставьте пустым/«-»."
    },
    {
      key:"have_past",
      title:"Платежи за прошлый год",
      text:"Есть сумма фактических платежей по проценту за прошлый год (для «гильотины», шаг D3)?",
      render: ()=> setInputSelect({label:"Есть данные?", choices:["Нет","Да"], value:"Нет"}),
      validate: (v)=> (v === "Да"),
    },
    {
      key:"past_year_percent_paid",
      title:"Сумма платежей за прошлый год",
      text:"Введите сумму (число ≥ 0). Пусто/«-» = нет данных.",
      when: ()=> A.have_past === true,
      render: ()=> setInputText({label:"Платежи за прошлый год", placeholder:"например 150000 (пусто / - = нет данных)"}),
      validate: (v)=>{
        const n = parseFloatMaybe(v);
        if(n === null) return null;
        if(!Number.isFinite(n) || n < 0) return null;
        return n;
      },
      error:"Введите число ≥ 0, или оставьте пустым/«-»."
    },
    {
      key:"_finish",
      title:"Готово к расчёту",
      text:"Проверь данные справа. Нажми «Далее» — запущу расчёт и покажу результат.",
      render: ()=> { inputBox.innerHTML = `<div class="muted">Нажмите «Далее», чтобы выполнить расчёт.</div>`; },
      validate: ()=> "__finish__"
    },
  ];

  let idx = 0;
  const history = [];

  function currentStep(){ return steps[idx]; }
  function visibleStepsCount(){ return steps.length; }

  function updateProgress(){
    const stepNo = history.length + 1;
    stepPill.textContent = `Шаг ${stepNo}`;
    const pct = Math.min(100, Math.round(((stepNo-1) / (visibleStepsCount()-1)) * 100));
    progressBar.style.width = pct + "%";
    progressLabel.textContent = pct + "%";
    backBtn.disabled = history.length === 0;
  }

  function render(){
    showError("");
    const s = currentStep();
    qTitle.textContent = s.title;
    qText.textContent = s.text;
    s.render();
    updateSummary();
    updateProgress();
  }

  function findNextIndex(fromIdx){
    let j = fromIdx + 1;
    while(j < steps.length){
      const st = steps[j];
      if(!st.when || st.when()) return j;
      j++;
    }
    return steps.length - 1;
  }

  function findPrevIndex(){
    if(history.length === 0) return idx;
    return history.pop();
  }

  function setAnswer(key, value){
    if(key === "_finish") return;
    A[key] = value;
  }

  function clearFinancialFields(){
    delete A.revenue_q;
    delete A.annual_revenue;
    delete A.expenses_q;
  }

  async function runCalc(){
    spin.style.display = "inline-block";
    nextBtn.disabled = true;
    backBtn.disabled = true;
    restartBtn.disabled = true;
    output.textContent = "Считаю…";

    const payload = {
      inn: A.inn,
      year: (A.year ?? null),

      annual_revenue: null,
      revenue_q: null,
      expenses_q: null,

      internet_resources: (A.internet_resources ?? 0),
      contract_quarter: (A.contract_quarter ?? 1),
      contract_media: (A.contract_media ?? "auto"),
      new_user: (A.new_user ?? false),

      only_license: (A.only_license ?? null),
      population_override: (A.population_override ?? null),
      past_year_percent_paid: (A.past_year_percent_paid ?? null),

      small_income_mode: (A.small_income_mode ?? "auto"),
    };

    if(A.base_type === "annual_revenue") payload.annual_revenue = A.annual_revenue ?? null;
    if(A.base_type === "revenue_q") payload.revenue_q = A.revenue_q ?? null;
    if(A.base_type === "expenses_q") payload.expenses_q = A.expenses_q ?? null;

    try{
      const res = await fetch("/api/calc", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });

      let text;
      try{
        const data = await res.json();
        text = data.output ?? JSON.stringify(data, null, 2);
      }catch{
        text = await res.text();
      }
      output.textContent = text;

    }catch(e){
      output.textContent = "Ошибка запроса к серверу: " + (e?.message ?? String(e));
    }finally{
      spin.style.display = "none";
      nextBtn.disabled = false;
      backBtn.disabled = (history.length === 0);
      restartBtn.disabled = false;
    }
  }

  nextBtn.addEventListener("click", async ()=>{
    showError("");
    const s = currentStep();
    const raw = getInputValue();

    const parsed = s.validate ? s.validate(raw) : raw;
    if(parsed === null && s.key === "inn"){
      showError(s.error || "Проверьте ввод.");
      return;
    }
    if(parsed === null && (s.key === "internet_resources")){
      showError(s.error || "Проверьте ввод.");
      return;
    }
    if(parsed === null && s.key !== "_finish" && s.error && !isEmptyOrDash(raw)){
      // если не пусто/не дефис — показываем ошибку
      showError(s.error);
      return;
    }

    if(s.key === "_finish"){
      await runCalc();
      return;
    }

    if(s.key === "base_type"){
      clearFinancialFields();
      setAnswer(s.key, parsed);
    } else {
      setAnswer(s.key, parsed);
    }

    if(s.key === "have_past") A.have_past = (raw === "Да");

    history.push(idx);
    idx = findNextIndex(idx);
    render();
  });

  backBtn.addEventListener("click", ()=>{
    showError("");
    idx = findPrevIndex();
    render();
  });

  restartBtn.addEventListener("click", ()=>{
    for(const k of Object.keys(A)) delete A[k];
    idx = 0;
    history.length = 0;
    output.textContent = "Результат появится здесь после расчёта.";
    render();
  });

  copyBtn.addEventListener("click", async ()=>{
    try{
      await navigator.clipboard.writeText(output.textContent);
      copyBtn.textContent = "Скопировано ✓";
      setTimeout(()=> copyBtn.textContent = "Скопировать", 900);
    }catch{
      copyBtn.textContent = "Не удалось";
      setTimeout(()=> copyBtn.textContent = "Скопировать", 900);
    }
  });

  render();
</script>
</body>
</html>
